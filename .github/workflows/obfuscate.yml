name: Obfuscate Hopline-proxy.js

# Hopline-proxy.js 或 obfuscate.mjs 变化（push 到 main）时自动生成 obf_Hopline-proxy.js；也可以手动触发（workflow_dispatch）。
# 只混淆代理脚本，且只做零运行时成本的处理（见 obfuscate.mjs）；面板脚本不提供混淆版。
on:
  push:
    branches: [main]
    paths:
      - 'Hopline-proxy.js'
      - 'obfuscate.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate obf_Hopline-proxy.js
        run: node obfuscate.mjs

      - name: Commit and push the obfuscated file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add obf_Hopline-proxy.js
          if git diff --staged --quiet; then
            echo "No changes to commit, obf_Hopline-proxy.js is already up-to-date."
          else
            git commit -m "chore: regenerate obf_Hopline-proxy.js"
            git push
          fi
